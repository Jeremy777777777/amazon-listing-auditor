name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - name: Build distribution with bundled review template
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Verify packaged template and provenance hash
        run: python scripts/check_packaged_template.py dist/*.whl

